# WeWrite 风格配置
# 复制为 style.yaml 并修改为你的公众号信息
# 或让 WeWrite 在首次使用时通过对话自动生成

name: "稳阵看球"
industry: "足球/竞猜"
target_audience: "足球爱好者，彩民"

# 内容方向
topics:
  - 足球比赛竞猜
  - 足球比赛赛况
  - 足坛新闻

# 写作风格
tone: "专业但不学术，观点尖锐，偶尔幽默"
voice: "第一人称，像一个懂行的朋友在分享见解"
word_count: "1500-3000"

# 内容风格（干货/故事/情绪/热点/测评）
# 影响选题偏好和框架推荐
content_style: "干货"

# 写作人格（决定文章语气、节奏与判断呈现方式）
# 可选：midnight-friend / industry-observer / sharp-journalist / warm-editor / cold-analyst
# 详见 personas/ 目录
writing_persona: "midnight-friend"

# 禁忌
blacklist:
  words: ["震惊", "必看", "不转不是中国人", "赶紧收藏"]
  topics: ["政治敏感", "宗教", "色情"]

# 参考账号风格
reference_accounts:
  - "爱足球的谢宇宁"
  - "甲门说球"

# 排版
# auto = 根据文章内容和最近历史自动轮换；fixed = 固定使用 theme
theme_mode: "auto"
theme: "professional-clean"

# 封面
cover_style: "激情，运动风，扁平化设计"
# cover_template: ""  # 设置后跳过 AI 生成，直接使用该文件

# 署名
author: "稳阵看球"
